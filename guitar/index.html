<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guitar</title>
<meta name="description" content="A campfire in a pixel forest and a guitar by the log.">
<meta name="theme-color" content="#0f0e0c">
<meta property="og:title" content="Guitar">
<meta property="og:description" content="A campfire in a pixel forest and a guitar by the log.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Press+Start+2P&display=swap">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/guitar/guitar.css">
<script src="/assets/decode.js" defer></script>
<script src="/assets/state.js" defer></script>
<script src="/assets/bubble.js" defer></script>
<script src="/guitar/scene.js" defer></script>
</head>
<body>
<div class="frame">
  <header class="meta">
    <a href="/">servitola</a>
    <span>guitar</span>
    <a href="https://github.com/servitola">github ↗</a>
  </header>

  <main class="stage">
    <div class="screen" id="screen" style="--px: 8px">
      <canvas id="scene" width="160" height="100" role="img" aria-label="A pixel-art campfire at night in a pine forest, a guitar leaning on a log beside it; now and then an animal peeks out of the trees."></canvas>
      <div class="start" id="start" role="button" tabindex="0">
        <b>PRESS START</b>
        <span>tap or any key to sit by the fire</span>
      </div>
      <p class="all" id="all" hidden>you've seen everyone. the fire doesn't mind if you stay.</p>
      <div class="bubble flip" id="bubble" role="dialog" aria-label="drop the towel?" hidden>
        <p class="ask">drop the towel?</p>
        <div class="row"><button class="choice" type="button" data-yes="1"><kbd>y</kbd><span>yes</span></button><button class="choice" type="button"><kbd>n</kbd><span>no</span></button></div>
      </div>
    </div>
  </main>

  <footer class="meta">
    <a href="/#dignity" id="back">← back<kbd>esc</kbd></a>
    <span class="live off" id="live"></span>
    <button type="button" id="sound">sound off<kbd>m</kbd></button>
  </footer>
</div>

<audio id="music" src="/assets/audio/sonic.mp3" loop preload="auto"></audio>

</body>
</html>
