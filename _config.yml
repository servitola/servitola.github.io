title: Adik Servitola
description: Пишу руками. Каждую букву, кроме кода.
url: https://servitola.github.io
lang: ru
timezone: Asia/Nicosia

permalink: /:year/:title/
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: drafts }
    values: { layout: post }

plugins:
  - jekyll-feed

exclude:
  - AGENTS.md
  - CLAUDE.md
  - README.md
