<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>servitola</title>
<meta name="description" content="servitola — personal site. What are you looking for?">
<link rel="canonical" href="https://servitola.com/">
<meta name="theme-color" content="#0f0e0c">
<meta property="og:title" content="servitola">
<meta property="og:description" content="What are you looking for?">
<meta property="og:url" content="https://servitola.com/">
<meta property="og:image" content="https://servitola.com/assets/img/answers.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="icon" href="data:,">
<link rel="preload" as="image" href="/assets/img/answers.webp">
<link rel="preload" as="image" href="/assets/img/dignity.webp">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/scenes.css">
<link rel="stylesheet" href="/assets/flood.css">
<link rel="stylesheet" href="/assets/spider.css">
<script src="/assets/decode.js" defer></script>
<script src="/assets/state.js" defer></script>
<script src="/assets/bubble.js" defer></script>
<script src="/assets/clock.js" defer></script>
<script src="/assets/spider.js" defer></script>
<script src="/assets/scenes.js" defer></script>
</head>
<body>
<div class="frame">
  <header class="meta">
    <span>servitola</span>
    <span class="perch">
      <a href="https://github.com/servitola">github ↗</a>
      <button class="rig" id="spider" type="button" aria-label="the spider"><i class="silk"></i><img src="/assets/img/spider.webp" width="84" height="80" alt=""><i class="pb"></i><i class="pb"></i><i class="pb"></i><b class="rip" aria-hidden="true">x_x</b><i class="tow"></i><i class="ding"></i><b class="pop" aria-hidden="true"></b><i class="hat"></i><i class="flake"></i></button>
      <div class="bubble" id="bubble" role="dialog" aria-label="drop the towel?" hidden>
        <p class="ask">drop the towel?</p>
        <div class="row"><button class="choice" type="button" data-yes="1"><kbd>y</kbd><span>yes</span></button><button class="choice" type="button"><kbd>n</kbd><span>no</span></button></div>
      </div>
    </span>
  </header>

  <main class="stage">
    <section class="scene" id="ask" aria-labelledby="q">
      <h1 id="q" aria-label="What are you looking for?"><span id="typed" aria-hidden="true"></span><span class="caret" aria-hidden="true"></span></h1>
      <p class="sub" id="sub" hidden></p>
      <ul class="choices" id="choices">
        <li><button class="choice" data-go="answers"><kbd>1</kbd><span>Answers</span></button></li>
        <li><button class="choice" data-go="dignity"><kbd>2</kbd><span>Dignity</span></button></li>
        <li><button class="choice" data-go="spider-man"><kbd>3</kbd><span>Spider-Man</span></button></li>
        <li class="nothing" id="nothing-li" hidden><button class="choice" data-go="nothing"><kbd>0</kbd><span>or nothing</span></button></li>
      </ul>
    </section>

    <section class="scene" id="nothing" hidden>
      <p class="say">Found it.</p>
      <div class="more" id="more" hidden>
        <p class="say">Want more?</p>
        <ul class="choices on">
          <li><button class="choice again" data-go="ask"><kbd>y</kbd><span>yes</span></button></li>
        </ul>
      </div>
    </section>

    <section class="scene" id="answers" hidden>
      <div class="answer">
        <figure><img src="/assets/img/answers.webp" width="1024" height="1280" alt="An old open guidebook floating in space with 42 printed across its pages; a huge vintage supercomputer hangs behind it and a towel drifts by."></figure>
        <div class="side">
          <p class="label">Answers</p>
          <p class="say">Forty-two.<br><em>Now find the question.</em></p>
          <button class="choice back" data-go="ask"><kbd>esc</kbd><span>ask again</span></button>
        </div>
      </div>
    </section>

    <section class="scene" id="dignity" hidden>
      <div class="answer">
        <figure><img src="/assets/img/dignity.webp" width="1024" height="1280" alt="God, eyes closed and smiling, tenderly hugs the big Russian word «ты» (you) to his chest."></figure>
        <div class="side">
          <p class="label">Dignity</p>
          <p class="say">You were never<br><em>not held.</em></p>
          <ul class="choices on">
            <li><button class="choice" data-go="weight"><kbd>w</kbd><span>Weight</span></button></li>
            <li><a class="choice" href="guitar/"><kbd>g</kbd><span>Guitar</span></a></li>
          </ul>
          <button class="choice back" data-go="ask"><kbd>esc</kbd><span>ask again</span></button>
        </div>
      </div>
    </section>

    <section class="scene" id="weight" hidden>
      <div class="flood">
        <div class="copy">
          <p class="label">Weight</p>
          <h2 class="say">Happiness<br><em>overflows.</em></h2>
        </div>
        <div class="sea deep" aria-hidden="true"><div class="bob"><svg viewBox="0 0 1200 130" preserveAspectRatio="none"><path d="M0 62 q75 -42 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 V130 H0 Z" fill="var(--dim)"/></svg></div></div>
        <div class="sea mid" aria-hidden="true">
          <div class="bob"><svg viewBox="0 0 1200 130" preserveAspectRatio="none">
            <defs><clipPath id="crest"><path d="M0 60 q75 -34 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 V130 H0 Z"/></clipPath></defs>
            <path d="M0 60 q75 -34 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 V130 H0 Z" fill="var(--hot)"/>
            <g clip-path="url(#crest)" fill="var(--ink)" opacity=".4"><rect y="78" width="1200" height="3"/><rect y="90" width="1200" height="4"/><rect y="104" width="1200" height="5"/><rect y="119" width="1200" height="6"/></g>
          </svg></div>
          <i class="bub" style="--y: 34vh; --x: 8%; --s: 1.6vmin; --d: .2s"></i><i class="bub" style="--y: 52vh; --x: 21%; --s: 2.6vmin; --d: 1.9s"></i><i class="bub" style="--y: 71vh; --x: 37%; --s: 1.2vmin; --d: 3.1s"></i><i class="bub" style="--y: 41vh; --x: 49%; --s: 2.1vmin; --d: .9s"></i><i class="bub" style="--y: 88vh; --x: 63%; --s: 1.5vmin; --d: 2.4s"></i><i class="bub" style="--y: 63vh; --x: 74%; --s: 3vmin; --d: 1.3s"></i><i class="bub" style="--y: 97vh; --x: 86%; --s: 1.3vmin; --d: 2.9s"></i><i class="bub" style="--y: 110vh; --x: 94%; --s: 2vmin; --d: .5s"></i>
        </div>
        <figure class="juice">
          <svg viewBox="0 0 200 262" role="img" aria-labelledby="juice-t">
            <title id="juice-t">A glass under an endless stream of juice fills, overflows, and floods the whole page orange.</title>
            <defs>
              <clipPath id="sun"><circle cx="100" cy="126" r="78"/></clipPath>
              <clipPath id="inside"><path d="M56 78H144L133.5 231Q132.5 237 127 237H73Q67.5 237 66.5 231Z"/></clipPath>
              <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.1" fill="var(--paper)" opacity=".22"/></pattern>
            </defs>
            <g clip-path="url(#sun)" fill="var(--dim)">
              <rect x="20" y="48" width="160" height="62"/>
              <rect x="20" y="116" width="160" height="22"/>
              <rect x="20" y="144" width="160" height="14"/>
              <rect x="20" y="164" width="160" height="9"/>
              <rect x="20" y="179" width="160" height="6"/>
              <rect x="20" y="191" width="160" height="4"/>
              <rect x="20" y="201" width="160" height="2.5"/>
            </g>
            <ellipse class="puddle" cx="100" cy="246" rx="150" ry="9" fill="var(--hot)"/>
            <path d="M52 74H148L137 232Q136 240 128 240H72Q64 240 63 232Z" fill="none" stroke="var(--hot)" stroke-width="3" stroke-linejoin="round" opacity=".6" transform="translate(3 2.5)"/>
            <path d="M52 74H148L137 232Q136 240 128 240H72Q64 240 63 232Z" fill="var(--ink)" fill-opacity=".86"/>
            <g class="pour">
              <rect x="95" y="-2400" width="9" height="2640" fill="var(--hot)"/>
              <line class="flow" x1="99.5" y1="-2400" x2="99.5" y2="238" stroke="var(--paper)" stroke-width="2" stroke-dasharray="7 15" opacity=".4"/>
            </g>
            <g clip-path="url(#inside)">
              <g class="liquid">
                <path class="wave" d="M-40 95q20-5 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0V320H-40Z" fill="var(--hot)"/>
                <rect x="-40" y="100" width="340" height="220" fill="url(#dots)"/>
                <g fill="none" stroke="var(--paper)" stroke-width="1.5">
                  <circle class="bubble" cx="84" cy="215" r="2.6"/>
                  <circle class="bubble" cx="118" cy="226" r="1.8"/>
                  <circle class="bubble" cx="102" cy="232" r="3"/>
                  <circle class="bubble" cx="74" cy="222" r="1.5"/>
                </g>
              </g>
            </g>
            <path class="brim" d="M47 72H153V80Q100 70 47 80Z" fill="var(--hot)" style="transform-origin: 100px 72px"/>
            <g class="drips" fill="none" stroke="var(--hot)" stroke-linecap="round">
              <path class="drip" d="M53 80L62 228" stroke-width="8" pathLength="1" style="--d: 0s"/>
              <path class="drip" d="M147 80L138 228" stroke-width="9" pathLength="1" style="--d: .25s"/>
              <path class="drip" d="M79 78L81 165" stroke-width="7" pathLength="1" style="--d: .6s"/>
              <path class="drip" d="M121 78L119 205" stroke-width="6" pathLength="1" style="--d: .4s"/>
              <path class="drip" d="M64 78L67 118" stroke-width="5" pathLength="1" style="--d: .9s"/>
              <path class="drip" d="M134 78L132 130" stroke-width="5" pathLength="1" style="--d: 1.1s"/>
            </g>
            <path d="M52 74H148L137 232Q136 240 128 240H72Q64 240 63 232Z" fill="none" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round"/>
            <path d="M62 92L58 160" stroke="var(--paper)" stroke-width="2" stroke-linecap="round" opacity=".55"/>
          </svg>
        </figure>
        <div class="sea front" aria-hidden="true"><div class="bob"><svg viewBox="0 0 1200 130" preserveAspectRatio="none"><path d="M0 64 q75 -28 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 V130 H0 Z" fill="var(--hot)"/><path d="M0 64 q75 -28 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0" fill="none" stroke="var(--paper)" stroke-width="4" vector-effect="non-scaling-stroke" opacity=".8"/></svg></div></div>
        <button class="choice back" data-go="dignity"><kbd>esc</kbd><span>back</span></button>
      </div>
    </section>

    <section class="scene" id="spider-man" hidden>
      <p class="spidey"><span>Spider-Man</span><span class="is">is</span><span class="who">Peter Parker.</span></p>
      <button class="choice next" data-go="not-a-choice"><kbd>→</kbd><span>next</span></button>
      <button class="choice back" data-go="ask"><kbd>esc</kbd><span>ask again</span></button>
    </section>

    <section class="scene" id="not-a-choice" hidden>
      <div class="slide">
        <p class="spidey"><span>It's not</span><span class="who">a choice.</span></p>
        <ul class="choices on">
          <li><button class="choice" data-go="yes"><kbd>y</kbd><span>Yes</span></button></li>
          <li><button class="choice" data-go="no"><kbd>n</kbd><span>No</span></button></li>
        </ul>
        <button class="choice back" data-go="spider-man"><kbd>esc</kbd><span>back</span></button>
      </div>
    </section>

    <section class="scene" id="yes" hidden>
      <div class="answer wide">
        <figure><img src="/assets/img/yes-1994.webp" width="1280" height="943" alt="A frame from the 1994 Spider-Man animated series."></figure>
        <div class="side">
          <button class="choice back" data-go="not-a-choice"><kbd>esc</kbd><span>back</span></button>
        </div>
      </div>
    </section>

    <section class="scene" id="no" hidden>
      <div class="answer wide">
        <figure><img src="/assets/img/no-gwen-2014.webp" width="1280" height="772" alt="Gwen Stacy in The Amazing Spider-Man 2 (2014)."></figure>
        <div class="side">
          <button class="choice back" data-go="not-a-choice"><kbd>esc</kbd><span>back</span></button>
        </div>
      </div>
    </section>
  </main>

  <footer class="meta"><span>Cyprus</span><span id="year"></span></footer>
</div>

</body>
</html>
