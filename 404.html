<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not found</title>
<meta name="theme-color" content="#0f0e0c">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/decode.js" defer></script>
<style>
.stage { padding-block: 2rem; }

h1 {
  margin: 0;
  font-weight: 400;
  font-style: italic;
  font-size: clamp(2.6rem, 8vw, 7rem);
  line-height: .92;
  letter-spacing: -.02em;
}
h1 em { color: var(--hot); }

.lost {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 1rem clamp(2rem, 6vw, 5rem);
  margin-top: clamp(4.5rem, 16vh, 10rem);
}

.num {
  margin: 0;
  font-weight: 400;
  font-style: italic;
  font-size: clamp(8rem, 46vw, 26rem);
  line-height: .74;
  letter-spacing: -.03em;
  white-space: nowrap;
}
.num .zero { position: relative; display: inline-block; }

/* Sized off the digit, so the spider stays perched at every viewport. */
.perched {
  --s: .44em;
  position: absolute;
  left: 60%;
  bottom: 81%;
  width: var(--s);
  margin-left: calc(var(--s) * -.58);
  font-size: inherit;
  line-height: 0;
  pointer-events: none;
  visibility: hidden;
  transform-origin: 58% 61%;
}
.perched.land { visibility: visible; animation: land .6s steps(5) both, tilt 2.4s steps(2) .6s infinite alternate; }
.perched img { display: block; width: 100%; height: auto; }
.tag {
  position: absolute;
  /* The sprite's raised right foot sits at (88%, 13%) of its box; the string is tied there. */
  left: 88%;
  top: 14%;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  transform: rotate(12deg);
  transform-origin: 0 0;
}
.tag::before {
  content: "";
  width: 1.5px;
  height: calc(var(--s) * .55);
  background: var(--paper);
  opacity: .85;
}
.tag b {
  font: 500 clamp(.6rem, 1.1vw, .78rem)/1 var(--mono);
  letter-spacing: .08em;
  text-transform: uppercase;
  white-space: nowrap;
  color: var(--ink);
  background: var(--hot);
  padding: .45em .6em .4em .9em;
  clip-path: polygon(.45em 0, 100% 0, 100% 100%, .45em 100%, 0 50%);
  box-shadow: 2px 2px 0 var(--paper);
  margin-left: -.45em;
  transform-origin: .45em 0;
}
.perched.land .tag b { animation: swing 1.8s steps(3) .6s infinite alternate; }

@keyframes land { from { transform: translateY(-1.4em) rotate(-12deg); } 80% { transform: translateY(.03em) rotate(-14deg); } to { transform: rotate(-12deg); } }
@keyframes tilt { from { transform: rotate(-12deg); } to { transform: rotate(-8deg) translateX(.01em); } }
@keyframes swing { from { transform: rotate(-6deg); } to { transform: rotate(5deg); } }

.choice {
  opacity: 0;
  transform: translateY(.6rem);
  transition: opacity .5s var(--ease), transform .5s var(--ease);
}
.choice.on { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  .perched { visibility: visible; transform: rotate(-12deg); }
  .tag b { transform: rotate(-3deg); }
}
</style>
</head>
<body>
<div class="frame">
  <header class="meta">
    <span>servitola</span>
    <a href="https://github.com/servitola">github ↗</a>
  </header>

  <main class="stage">
    <h1 id="q"><span class="unit">What <em>were</em> you looking for?</span><span class="caret" aria-hidden="true"></span></h1>
    <div class="lost">
      <p class="sr-only">404, not found.</p>
      <p class="num unit" aria-hidden="true">4<span class="zero">0<span class="perched keep" id="spider"><img src="/assets/img/spider.webp" width="168" height="160" alt=""><span class="tag"><b>not found</b></span></span></span>4</p>
      <a class="choice unit" id="home" href="/"><kbd>esc</kbd><span>back to the question</span></a>
    </div>
  </main>

  <footer class="meta"><a href="/links/">links</a><span id="year"></span></footer>
</div>

<script type="module">
const question = document.getElementById("q");
const home = document.getElementById("home");
const spider = document.getElementById("spider");
const units = [...document.querySelectorAll(".unit")];

document.getElementById("year").textContent = new Date().getFullYear();
addEventListener("keydown", e => {
  if (e.key === "Escape" && !(e.metaKey || e.ctrlKey || e.altKey)) location.href = "/";
});

function arrive() {
  question.classList.add("done");
  spider.classList.add("land");
  home.classList.add("on");
  home.focus({ preventScroll: true });
}

if (still) arrive();
else {
  hush(units);
  fontsReady(['italic 1em "Instrument Serif"', '1em "JetBrains Mono"', '500 1em "JetBrains Mono"']).then(() => {
    units.forEach(typeset);
    const [ask, num, link] = units;
    decode([ask], () => decode([num], () => { arrive(); decode([link]); }));
  });
}
</script>
<script>if (location.hostname === "servitola.com") document.head.append(Object.assign(document.createElement("script"), { defer: true, src: "https://static.cloudflareinsights.com/beacon.min.js", dataset: { cfBeacon: '{"token": "bfbcf0b6465a49d49cdf9742f13cca69"}' } }));</script>
</body>
</html>
